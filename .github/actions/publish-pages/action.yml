name: Publish GitHub Pages
description: Replay-safely deploy and verify the selected immutable release on GitHub Pages
inputs:
  github-token:
    description: GitHub token
    required: true
  repository:
    description: owner/repository
    required: true
  commit:
    description: Immutable release commit whose verified bytes are being deployed
    required: true
  dist-path:
    description: Extracted canonical distribution
    required: true
  identity-path:
    description: Expected release-bound Pages deployment identity
    required: true
  identity-url-path:
    description: Relative deployed URL path containing the identity document
    required: false
    default: deployment-identity.json
outputs:
  page-url:
    description: Published Pages URL
    value: ${{ steps.result.outputs.page-url }}
runs:
  using: composite
  steps:
    - name: Configure GitHub Pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

    - name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
      with:
        path: ${{ inputs.dist-path }}

    - name: Deploy GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

    - name: Verify Pages deployment status
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      shell: bash
      run: |
        set -euo pipefail
        # The Pages deployment created by deploy-pages is keyed by this workflow SHA. Verify that
        # deployment directly instead of inferring completion from generic environment state.
        # The immutable release commit and bytes are separately bound by the promotion identity.
        status="$(gh api "repos/${{ inputs.repository }}/pages/deployments/$GITHUB_SHA" --jq '.status')"
        if [[ "$status" != succeed ]]; then
          echo "Pages deployment is not complete: $status" >&2
          exit 1
        fi
        echo "Pages deployment complete for immutable release ${{ inputs.commit }}"

    - name: Resolve Pages URL
      id: result
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
      shell: bash
      run: |
        set -euo pipefail
        page_url="$DEPLOYED_URL"
        if [[ -z "$page_url" ]]; then
          page_url="$(gh api "repos/${{ inputs.repository }}/pages" --jq '.html_url')"
        fi
        echo "page-url=$page_url" >> "$GITHUB_OUTPUT"

    - name: Verify live Pages release identity
      env:
        PAGE_URL: ${{ steps.result.outputs.page-url }}
        EXPECTED_IDENTITY: ${{ inputs.identity-path }}
      shell: bash
      run: |
        set -euo pipefail
        live_identity="$RUNNER_TEMP/pages-deployment-identity.json"
        verified=false
        for verify_attempt in 1 2 3 4 5; do
          identity_path="${{ inputs.identity-url-path }}"
          identity_url="${PAGE_URL%/}/${identity_path#/}?promotion_run=$GITHUB_RUN_ID&run_attempt=$GITHUB_RUN_ATTEMPT&verify=$verify_attempt"
          if curl --fail --silent --show-error --location \
            --header 'Cache-Control: no-cache' \
            "$identity_url" \
            --output "$live_identity" &&
            python3 scripts/pages_identity.py verify \
              --expected "$EXPECTED_IDENTITY" \
              --actual "$live_identity"; then
            verified=true
            break
          fi
          sleep 2
        done
        if [[ "$verified" != true ]]; then
          echo "live Pages deployment identity did not converge to the expected release" >&2
          exit 1
        fi
        echo "Live Pages identity verified for immutable release ${{ inputs.commit }}"
