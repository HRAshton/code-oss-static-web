name: Generate independent SBOM
description: Scan the final static distribution with pinned Syft for independent composition evidence
inputs:
  path:
    description: Final distribution path to scan
    required: true
  output-file:
    description: CycloneDX JSON output path
    required: true
runs:
  using: composite
  steps:
    - name: Scan final distribution with Syft
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        path: ${{ inputs.path }}
        format: cyclonedx-json
        output-file: ${{ inputs.output-file }}
        syft-version: v1.48.0
        config: security/syft.yaml
        dependency-snapshot: 'false'
        upload-artifact: 'false'
        upload-release-assets: 'false'
