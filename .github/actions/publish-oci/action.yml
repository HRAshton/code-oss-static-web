name: Publish GHCR image
description: Verify an existing immutable image or publish it from the canonical static distribution
inputs:
  github-token:
    description: GitHub token
    required: true
  image:
    description: Fully qualified GHCR image reference
    required: true
  commit:
    description: Immutable release commit
    required: true
  tag:
    description: Immutable release tag
    required: true
  dist-path:
    description: Extracted canonical distribution
    required: true
runs:
  using: composite
  steps:
    - name: Log in to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      with:
        driver-opts: |
          image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

    - name: Check existing GHCR publication
      id: state
      shell: bash
      run: |
        set -euo pipefail
        set +e
        inspect_output="$(docker buildx imagetools inspect "${{ inputs.image }}" 2>&1)"
        inspect_status=$?
        set -e

        if [[ "$inspect_status" == 0 ]]; then
          echo 'exists=true' >> "$GITHUB_OUTPUT"
        elif grep -Eqi '(^|[[:space:]:])(not found|manifest unknown)([[:space:]:]|$)' <<<"$inspect_output"; then
          echo 'exists=false' >> "$GITHUB_OUTPUT"
        else
          printf '%s\n' "$inspect_output" >&2
          echo 'unable to determine GHCR publication state; refusing to publish' >&2
          exit "$inspect_status"
        fi

    - name: Verify existing GHCR publication
      if: steps.state.outputs.exists == 'true'
      shell: bash
      run: >-
        scripts/verify_oci_image.sh
        "${{ inputs.image }}"
        "${{ inputs.commit }}"
        "${{ inputs.tag }}"
        "${{ inputs.dist-path }}"

    - name: Build and push OCI image
      if: steps.state.outputs.exists == 'false'
      id: publish
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        file: deploy/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ inputs.image }}
        labels: |
          org.opencontainers.image.source=https://github.com/Codellei/code-oss-static-web
          org.opencontainers.image.revision=${{ inputs.commit }}
          org.opencontainers.image.version=${{ inputs.tag }}
        provenance: mode=max
        sbom: true

    - name: Verify GHCR publication
      shell: bash
      run: >-
        scripts/verify_oci_image.sh
        "${{ inputs.image }}"
        "${{ inputs.commit }}"
        "${{ inputs.tag }}"
        "${{ inputs.dist-path }}"
