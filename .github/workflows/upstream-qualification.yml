name: Upstream qualification trigger

on:
  push:
    branches: [master]
    paths:
      - upstream.lock.json

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Detect upstream revision change
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')"
          current_sha="$(
            gh api "repos/$GITHUB_REPOSITORY/commits/$default_branch" --jq '.sha'
          )"
          old_lock="$(
            gh api -H 'Accept: application/vnd.github.raw+json'               "repos/$GITHUB_REPOSITORY/contents/upstream.lock.json?ref=$BEFORE_SHA"
          )"
          new_lock="$(
            gh api -H 'Accept: application/vnd.github.raw+json'               "repos/$GITHUB_REPOSITORY/contents/upstream.lock.json?ref=$current_sha"
          )"
          old_revision="$(jq -r '[.tag, .commit] | @tsv' <<<"$old_lock")"
          new_revision="$(jq -r '[.tag, .commit] | @tsv' <<<"$new_lock")"
          if [[ "$old_revision" == "$new_revision" ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
          echo "source_sha=$current_sha" >> "$GITHUB_OUTPUT"
          {
            echo "Trigger push SHA: `$GITHUB_SHA`"
            echo "Inspected current $default_branch SHA: `$current_sha`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start full browser qualification
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.upstream.outputs.source_sha }}
        run: >-
          gh workflow run qualify.yml
          --repo "$GITHUB_REPOSITORY"
          --ref master
          -f browser=all
          -f release_mode=upstream
          -f expected_source_sha="$SOURCE_SHA"
