name: Full build qualification

on:
  push:
    branches: [develop]
    paths:
      - upstream.lock.json
      - build.sh
      - package.sh
      - 'scripts/**'
      - 'config/**'
      - 'patches/**'
      - 'extensions/**'
      - 'deploy/**'
      - 'tests/e2e/**'
      - 'tests/fixtures/**'
      - '.github/workflows/qualify.yml'
      - '.github/actions/browser-qualification/action.yml'
      - '.github/actions/setup-toolchain/action.yml'
      - '.github/toolchain-versions.json'
      - 'builder-image.json'
      - 'builder-apt-snapshot.json'
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact source commit inspected by the dispatcher
        required: true
        type: string
      browser:
        description: Browser qualification target
        required: true
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all
      release_mode:
        description: Publication intent
        required: true
        default: none
        type: choice
        options:
          - none
          - upstream
          - patch
  workflow_call:
    inputs:
      expected_source_sha:
        required: true
        type: string
      browser:
        required: true
        type: string
      release_mode:
        required: true
        type: string
      security_override_reason:
        required: false
        default: ''
        type: string

concurrency:
  group: qualify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tooling:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run tooling checks
        uses: ./.github/actions/tooling-checks

  browser-plan:
    name: Qualification plan
    needs: tooling
    if: >-
      always() && needs.tooling.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      browsers: ${{ steps.plan.outputs.browsers }}
      scope: ${{ steps.plan.outputs.scope }}
      level: ${{ steps.plan.outputs.level }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      retry_tag: ${{ steps.plan.outputs.retry_tag }}
      apt_snapshot: ${{ steps.builder-lock.outputs.apt_snapshot }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve pinned builder snapshot
        id: builder-lock
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$(jq -er '.aptSnapshot' builder-apt-snapshot.json)"
          [[ "$snapshot" =~ ^[0-9]{8}T[0-9]{6}Z$ ]]
          echo "apt_snapshot=$snapshot" >> "$GITHUB_OUTPUT"

      - name: Verify trusted emergency dispatch and approved operator
        if: ${{ inputs.security_override_reason != '' }}
        env:
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REQUESTED_BROWSER: ${{ inputs.browser }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          SECURITY_OVERRIDE_REASON: ${{ inputs.security_override_reason }}
        run: python3 scripts/authorize_soak_override.py

      - name: Verify expected source SHA
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_qualification_source.py "$EXPECTED_SOURCE_SHA" "$GITHUB_SHA"
          {
            echo "Expected source SHA: `$EXPECTED_SOURCE_SHA`"
            echo "Qualification source SHA: `$GITHUB_SHA`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Select browser qualification plan
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REQUESTED_BROWSER: ${{ inputs.browser || 'all' }}
          RELEASE_MODE: ${{ inputs.release_mode || 'none' }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          level=full
          scope=full
          case "$EVENT_NAME" in
            pull_request)
              mkdir -p .work
              gh api --paginate \
                "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
                --jq '.[] | .filename, (.previous_filename // empty)' \
                > .work/pull-request-files.txt
              unset GH_TOKEN
              level="$(python3 scripts/classify_pr.py .work/pull-request-files.txt)"
              case "$level" in
                lightweight)
                  browsers='[]'
                  scope=smoke
                  ;;
                release)
                  browsers='[]'
                  scope=smoke
                  ;;
                artifact)
                  browsers='["chromium"]'
                  scope=smoke
                  ;;
                full)
                  browsers='["chromium","firefox","webkit"]'
                  scope=full
                  ;;
                *)
                  echo "Unsupported pull request qualification level: $level" >&2
                  exit 2
                  ;;
              esac
              ;;
            workflow_dispatch)
              case "$REQUESTED_BROWSER" in
                chromium|firefox|webkit)
                  browsers="[\"$REQUESTED_BROWSER\"]"
                  ;;
                all)
                  browsers='["chromium","firefox","webkit"]'
                  ;;
                *)
                  echo "Unsupported browser: $REQUESTED_BROWSER" >&2
                  exit 2
                  ;;
              esac
              ;;
            push)
              browsers='["chromium","firefox","webkit"]'
              ;;
            *)
              echo "Unsupported qualification event: $EVENT_NAME" >&2
              exit 2
              ;;
          esac
          release_tag=''
          retry_tag=''
          if [[ "$EVENT_NAME" == workflow_dispatch &&
                "$GITHUB_REF_NAME" == master &&
                "$REQUESTED_BROWSER" == all &&
                "$RELEASE_MODE" != none ]]; then
            version="$(jq -r '.tag' upstream.lock.json)"
            case "$RELEASE_MODE" in
              upstream)
                release_tag="v${version}-web.0"
                ;;
              patch)
                prefix="refs/tags/v${version}-web."
                max_revision=-1
                found_zero=0
                latest_tag=''
                while IFS= read -r ref; do
                  suffix="${ref#"$prefix"}"
                  [[ "$suffix" =~ ^(0|[1-9][0-9]*)$ ]] || continue
                  revision=$((10#$suffix))
                  if [[ "$revision" == 0 ]]; then
                    found_zero=1
                  fi
                  if (( revision > max_revision )); then
                    max_revision="$revision"
                    latest_tag="${ref#refs/tags/}"
                  fi
                done < <(
                  gh api --paginate \
                    "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v${version}-web." \
                    --jq '.[].ref'
                )

                if [[ "$found_zero" != 1 ]]; then
                  echo "Cannot create a patch release before v${version}-web.0 exists." >&2
                  exit 1
                fi

                latest_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$latest_tag" --jq '.sha')"
                if [[ "$latest_sha" == "$GITHUB_SHA" ]]; then
                  release_tag="$latest_tag"
                else
                  release_tag="v${version}-web.$((max_revision + 1))"
                fi
                ;;
              *)
                echo "Unsupported release mode: $RELEASE_MODE" >&2
                exit 2
                ;;
            esac

            python3 scripts/check_release_tag.py "$release_tag"
            if ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag" 2>/dev/null)"; then
              existing_sha="$(jq -r '.object.sha' <<<"$ref")"
              if [[ "$existing_sha" != "$GITHUB_SHA" ]]; then
                echo "release tag $release_tag already points to $existing_sha, not $GITHUB_SHA" >&2
                exit 1
              fi
              retry_tag="$release_tag"
            fi
          fi

          {
            echo "level=$level"
            echo "browsers=$browsers"
            echo "scope=$scope"
            echo "release_tag=$release_tag"
            echo "retry_tag=$retry_tag"
          } >> "$GITHUB_OUTPUT"

  recover-publication:
    name: Recover existing immutable publication
    needs: browser-plan
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref_name == 'master' &&
      needs.browser-plan.outputs.retry_tag != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch artifact-only publication recovery
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.browser-plan.outputs.retry_tag }}
        shell: bash
        run: |
          set -euo pipefail

          release_runs="$(
            gh api \
              --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs" \
              -f head_sha="$GITHUB_SHA" \
              -f event=workflow_dispatch \
              -f status=completed \
              -F per_page=100
          )"
          mapfile -t candidate_run_ids < <(
            jq -r \
              --arg tag "$RELEASE_TAG" \
              --arg sha "$GITHUB_SHA" \
              '
                .workflow_runs[]
                | select(
                    .name == "Release" and
                    .event == "workflow_dispatch" and
                    .status == "completed" and
                    .head_branch == $tag and
                    .head_sha == $sha and
                    .path == ".github/workflows/release.yml"
                  )
                | .id
              ' <<<"$release_runs"
          )

          release_run_id=''
          for candidate_run_id in "${candidate_run_ids[@]}"; do
            artifacts="$(
              gh api \
                "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id/artifacts?per_page=100"
            )"
            if jq -e '
              def available($name):
                [.artifacts[] | select(.name == $name and .expired == false)] | length == 1;
              available("release-static-dist") and
              available("release-candidate") and
              available("release-attestation")
            ' <<<"$artifacts" >/dev/null; then
              release_run_id="$candidate_run_id"
              break
            fi
          done

          if [[ -z "$release_run_id" ]]; then
            echo "release tag $RELEASE_TAG already exists, but no completed Release run for this tag and commit retains all publication artifacts" >&2
            echo "refusing to infer publication completion or rebuild immutable release content" >&2
            exit 1
          fi

          gh workflow run recover-release-publication.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f release_tag="$RELEASE_TAG" \
            -f release_run_id="$release_run_id" \
            -f channel=all
          echo "Existing immutable tag detected; dispatched publication verification/recovery from Release run $release_run_id"

  build:
    needs: browser-plan
    if: >-
      (needs.browser-plan.outputs.level == 'artifact' ||
       needs.browser-plan.outputs.level == 'full') &&
      needs.browser-plan.outputs.retry_tag == ''
    runs-on: ubuntu-latest
    container:
      image: public.ecr.aws/docker/library/ubuntu@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517
      volumes:
        - /etc/ssl/certs/ca-certificates.crt:/tmp/runner-ca-bundle.pem:ro
    permissions:
      contents: read
    env:
      APT_SNAPSHOT: ${{ needs.browser-plan.outputs.apt_snapshot }}
    steps:
      - name: Bootstrap snapshot-locked builder packages
        shell: bash
        run: |
          set -euo pipefail
          # Minimal Ubuntu has no CA roots; trust the runner bundle for snapshot TLS only.
          test -s /tmp/runner-ca-bundle.pem
          apt-get update --snapshot "$APT_SNAPSHOT" \
            -o Acquire::https::CaInfo=/tmp/runner-ca-bundle.pem \
            -o APT::Update::Error-Mode=any
          snapshot_origin="https://snapshot.ubuntu.com/ubuntu/$APT_SNAPSHOT"
          apt-cache -o APT::Snapshot="$APT_SNAPSHOT" policy build-essential |
            grep -F "$snapshot_origin"
          DEBIAN_FRONTEND=noninteractive apt-get install \
            --snapshot "$APT_SNAPSHOT" -y --no-install-recommends \
            -o Acquire::https::CaInfo=/tmp/runner-ca-bundle.pem \
            ca-certificates curl git jq tar unzip xz-utils \
            build-essential pkg-config libx11-dev libxkbfile-dev libkrb5-dev

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify builder APT snapshot lock
        run: test "$(jq -er '.aptSnapshot' builder-apt-snapshot.json)" = "$APT_SNAPSHOT"

      - name: Set up canonical toolchain
        id: toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Restore immutable upstream web build cache
        id: upstream-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .work/vscode-web
            .work/playwright-runtime
          key: code-oss-web-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.toolchain.outputs.node-version }}-python-${{ steps.toolchain.outputs.python-version }}-${{ hashFiles('builder-image.json', 'builder-apt-snapshot.json', '.github/workflows/qualify.yml', 'upstream.lock.json', 'build.sh', 'scripts/common.py', 'scripts/build.py', 'scripts/fetch_upstream.py', 'scripts/prepare_upstream.py', 'scripts/deployment_profile.py', 'scripts/apply_patches.py', 'scripts/export_playwright_runtime.py', 'config/**', 'patches/**') }}

      - name: Restore npm download cache
        if: steps.upstream-cache.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.npm
          key: code-oss-npm-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.toolchain.outputs.node-version }}-${{ hashFiles('upstream.lock.json') }}
          restore-keys: |
            code-oss-npm-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.toolchain.outputs.node-version }}-

      - name: Build static Code-OSS candidate
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        shell: bash
        run: |
          if [[ "${{ steps.upstream-cache.outputs.cache-hit }}" == 'true' ]]; then
            ./build.sh --reuse-upstream-build
          else
            ./build.sh
          fi

      - name: Structural artifact smoke test
        run: python3 scripts/smoke_static.py dist

      - name: Capture runtime component metadata
        run: >-
          python3 scripts/generate_runtime_metadata.py
          --dist dist
          --lock .work/vscode/package-lock.json
          --output .work/runtime-components.json

      - name: Archive canonical static distribution
        run: |
          mkdir -p .work
          tar -C dist -cf .work/static-dist.tar .

      - name: Upload canonical static distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-dist
          path: .work/static-dist.tar
          if-no-files-found: error
          retention-days: 3
          compression-level: 6

      - name: Upload locked Playwright runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-runtime
          path: .work/playwright-runtime/
          if-no-files-found: error
          retention-days: 3
          compression-level: 6

      - name: Upload build metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-metadata
          path: .work/runtime-components.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 6

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-diagnostics
          path: .work/product-transform-report.json
          if-no-files-found: ignore
          retention-days: 7

  browser:
    needs: [build, browser-plan]
    if: >-
      (needs.browser-plan.outputs.level == 'artifact' ||
       needs.browser-plan.outputs.level == 'full') &&
      needs.browser-plan.outputs.retry_tag == ''
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(needs.browser-plan.outputs.browsers) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Qualify browser
        uses: ./.github/actions/browser-qualification
        with:
          browser: ${{ matrix.browser }}
          distribution-artifact: static-dist
          playwright-runtime-artifact: playwright-runtime
          scope: ${{ needs.browser-plan.outputs.scope }}
          diagnostics-artifact: qualification-diagnostics-${{ matrix.browser }}

      - name: Upload qualified Chromium runtime
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.browser == 'chromium' &&
          matrix.browser == 'chromium'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-browser-chromium
          path: .work/playwright-browsers/
          if-no-files-found: error
          retention-days: 2
          compression-level: 6

  production-serving:
    name: OCI production-serving qualification
    needs: [build, browser-plan]
    if: >-
      (needs.browser-plan.outputs.level == 'artifact' ||
       needs.browser-plan.outputs.level == 'full') &&
      needs.browser-plan.outputs.retry_tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up canonical toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Download canonical static distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: static-dist
          path: .work/static-dist

      - name: Extract canonical static distribution
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist
          tar -C dist -xf .work/static-dist/static-dist.tar

      - name: Build and start OCI image
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag code-oss-static-web:qualification --file deploy/Dockerfile .
          docker run --detach --rm \
            --name code-oss-static-web-qualification \
            -p 127.0.0.1:8080:8080 \
            code-oss-static-web:qualification
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs code-oss-static-web-qualification >&2
          exit 1

      - name: Assert OCI HTTP contract
        run: >-
          python3 scripts/check_hosting_contract.py
          --target oci
          --url http://127.0.0.1:8080/

      - name: Browser smoke against OCI image
        uses: ./.github/actions/browser-qualification
        with:
          browser: chromium
          playwright-runtime-artifact: playwright-runtime
          scope: serving
          base-url: http://127.0.0.1:8080/
          diagnostics-artifact: oci-serving-diagnostics

      - name: Stop OCI qualification container
        if: always()
        run: docker rm --force code-oss-static-web-qualification >/dev/null 2>&1 || true

  release-metadata:
    name: Release metadata qualification
    needs: browser-plan
    if: >-
      github.event_name == 'pull_request' &&
      needs.browser-plan.outputs.level == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up canonical toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Qualify release metadata and policy
        uses: ./.github/actions/release-metadata-qualification

  artifact-gate:
    name: Artifact qualification gate
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [browser-plan, release-metadata, build, browser, production-serving, package]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify required artifact evidence
        env:
          LEVEL: ${{ needs.browser-plan.outputs.level }}
          PLAN_RESULT: ${{ needs.browser-plan.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          RELEASE_METADATA_RESULT: ${{ needs.release-metadata.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          SERVING_RESULT: ${{ needs.production-serving.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PLAN_RESULT" != success ]]; then
            echo "qualification planning did not succeed: $PLAN_RESULT" >&2
            exit 1
          fi

          case "$LEVEL" in
            lightweight)
              echo "Documentation-only pull request: artifact build not required."
              ;;
            release)
              if [[ "$RELEASE_METADATA_RESULT" != success ]]; then
                echo "required release metadata evidence missing: release-metadata=$RELEASE_METADATA_RESULT" >&2
                exit 1
              fi
              ;;
            artifact|full)
              if [[ "$BUILD_RESULT" != success ||
                    "$BROWSER_RESULT" != success ||
                    "$SERVING_RESULT" != success ||
                    "$PACKAGE_RESULT" != success ]]; then
                echo "required artifact evidence missing: build=$BUILD_RESULT browser=$BROWSER_RESULT serving=$SERVING_RESULT package=$PACKAGE_RESULT" >&2
                exit 1
              fi
              ;;
            *)
              echo "Unknown pull request qualification level: $LEVEL" >&2
              exit 1
              ;;
          esac

  package:
    needs: [browser-plan, browser, production-serving]
    if: >-
      needs.browser-plan.outputs.retry_tag == '' &&
      (github.event_name != 'pull_request' ||
       needs.browser-plan.outputs.level == 'artifact' ||
       needs.browser-plan.outputs.level == 'full')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up canonical Python
        id: toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          node: 'false'

      - name: Download qualified static distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: static-dist
          path: .work/static-dist

      - name: Extract canonical static distribution
        run: |
          rm -rf dist
          mkdir -p dist
          tar -C dist -xf .work/static-dist/static-dist.tar

      - name: Download build metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-metadata
          path: .work

      - name: Generate independent final-distribution SBOM
        uses: ./.github/actions/independent-sbom
        with:
          path: dist
          output-file: .work/independent-sbom.cdx.json

      - name: Install pinned vulnerability scanner
        shell: bash
        run: |
          set -euo pipefail
          grype_version=0.120.0
          grype_sha256=a5a1218dce63acdac152a6b3b5bb366e7267e36f4069848cf455543b3fa5700e
          mkdir -p .work/tools
          archive=".work/tools/grype_${grype_version}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location             "https://github.com/anchore/grype/releases/download/v${grype_version}/grype_${grype_version}_linux_amd64.tar.gz"             --output "$archive"
          printf '%s  %s\n' "$grype_sha256" "$archive" | sha256sum --check -
          tar -C .work/tools -xzf "$archive" grype
          .work/tools/grype version

      - name: Vulnerability and rollout admission gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ inputs.release_mode || 'none' }}
          SECURITY_OVERRIDE_REASON: ${{ inputs.security_override_reason || '' }}
          SECURITY_OVERRIDE_ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          .work/tools/grype sbom:.work/independent-sbom.cdx.json -o json > .work/grype-report.json
          upstream_release_published_at=''
          if [[ "$RELEASE_MODE" == upstream ]]; then
            upstream_tag="$(jq -r '.tag' upstream.lock.json)"
            upstream_release_published_at="$(
              gh api "repos/microsoft/vscode/releases/tags/$upstream_tag" \
                --jq 'select(.draft == false and .prerelease == false) | .published_at'
            )"
            if [[ -z "$upstream_release_published_at" ||
                  "$upstream_release_published_at" == null ]]; then
              echo "Upstream release $upstream_tag has no public publication timestamp." >&2
              exit 1
            fi
          fi
          args=(
            --report .work/grype-report.json
            --policy config/vulnerability-policy.json
            --release-mode "$RELEASE_MODE"
            --output .work/vulnerability-admission.json
          )
          if [[ -n "$upstream_release_published_at" ]]; then
            args+=(--upstream-release-published-at "$upstream_release_published_at")
          fi
          if [[ -n "$SECURITY_OVERRIDE_REASON" ]]; then
            args+=(
              --override-reason "$SECURITY_OVERRIDE_REASON"
              --override-actor "$SECURITY_OVERRIDE_ACTOR"
            )
          fi
          python3 scripts/vulnerability_policy.py "${args[@]}"

      - name: Package canonical candidate
        run: ./package.sh

      - name: Upload vulnerability qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vulnerability-qualification
          path: |
            .work/grype-report.json
            .work/vulnerability-admission.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload canonical candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  attest:
    needs: package
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download verified candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: candidate
          path: artifacts

      - name: Attest release provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: artifacts/SHA256SUMS

      - name: Attest release SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/code-oss-static-web-*.tar.gz
          sbom-path: artifacts/sbom.cdx.json

      - name: Upload qualification provenance bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-provenance
          path: ${{ steps.provenance.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [browser-plan, build, browser, package, attest]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref_name == 'master' &&
      inputs.browser == 'all' &&
      inputs.release_mode != 'none' &&
      needs.browser-plan.outputs.retry_tag == ''
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download qualified candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: candidate
          path: .work/qualified-candidate

      - name: Download qualification provenance bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: qualification-provenance
          path: .work/qualification-provenance

      - name: Download vulnerability qualification evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: vulnerability-qualification
          path: .work/vulnerability-qualification

      - name: Record release qualification
        id: qualification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.browser-plan.outputs.release_tag }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mode="${{ inputs.release_mode }}"
          tag="$RELEASE_TAG"

          python3 scripts/check_release_tag.py "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          toolchain="$(jq -c '{node, python}' .github/toolchain-versions.json)"
          builder="$(jq -cs '.[0] as $image | .[1] as $apt | {image: $image.image, digest: $image.digest, platform: $image.platform, aptSnapshot: $apt.aptSnapshot}' builder-image.json builder-apt-snapshot.json)"
          manifest=.work/qualified-candidate/artifact-manifest.json
          jq -e \
            --arg commit "$GITHUB_SHA" \
            --argjson toolchain "$toolchain" \
            --argjson builder "$builder" \
            '
              .schemaVersion == 1 and
              .project.commit == $commit and
              .toolchain == $toolchain and
              .builder == $builder
            ' \
            "$manifest" >/dev/null

          distribution="$(jq -c '.distribution' "$manifest")"
          tree_sha256="$(jq -r '.treeSha256' <<<"$distribution")"
          file_count="$(jq -r '.fileCount' <<<"$distribution")"
          if [[ ! "$tree_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "invalid qualified distribution tree digest: $tree_sha256" >&2
            exit 1
          fi
          if [[ ! "$file_count" =~ ^[1-9][0-9]*$ ]]; then
            echo "invalid qualified distribution file count: $file_count" >&2
            exit 1
          fi

          mapfile -t provenance_bundles < <(
            find .work/qualification-provenance -maxdepth 1 -type f -print
          )
          if (( ${#provenance_bundles[@]} != 1 )); then
            echo "expected exactly one qualification provenance bundle, found ${#provenance_bundles[@]}" >&2
            exit 1
          fi

          mkdir -p .work/release-qualification
          cp "$manifest" .work/release-qualification/artifact-manifest.json
          cp "${provenance_bundles[0]}" \
            .work/release-qualification/qualification-provenance.sigstore.json
          cp .work/vulnerability-qualification/grype-report.json \
            .work/release-qualification/grype-report.json
          cp .work/vulnerability-qualification/vulnerability-admission.json \
            .work/release-qualification/vulnerability-admission.json
          jq -e '.schemaVersion == 1 and .passed == true' \
            .work/release-qualification/vulnerability-admission.json >/dev/null

          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg expectedSourceSha "$EXPECTED_SOURCE_SHA" \
            --arg tag "$tag" \
            --arg releaseMode "$mode" \
            --argjson workflowRunId "$GITHUB_RUN_ID" \
            --argjson toolchain "$toolchain" \
            --argjson builder "$builder" \
            --argjson distribution "$distribution" \
            '{
              commit: $commit,
              expectedSourceSha: $expectedSourceSha,
              tag: $tag,
              releaseMode: $releaseMode,
              workflowRunId: $workflowRunId,
              toolchain: $toolchain,
              builder: $builder,
              distribution: $distribution
            }' \
            > .work/release-qualification/release-qualification.json
          {
            echo "Expected source SHA: `$EXPECTED_SOURCE_SHA`"
            echo "Qualified distribution: `$tree_sha256` ($file_count files)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Qualified distribution: $tree_sha256 ($file_count files)"

      - name: Upload release qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-qualification
          path: .work/release-qualification/
          if-no-files-found: error
          retention-days: 30

      - name: Create immutable release tag and dispatch publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.qualification.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" 2>/dev/null)"; then
            existing_sha="$(jq -r '.object.sha' <<<"$ref")"
            if [[ "$existing_sha" != "$GITHUB_SHA" ]]; then
              echo "release tag $RELEASE_TAG already points to $existing_sha, not $GITHUB_SHA" >&2
            else
              echo "release tag $RELEASE_TAG appeared after qualification planning; rerun to enter artifact-only recovery" >&2
            fi
            exit 1
          fi

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$GITHUB_SHA" >/dev/null

          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$RELEASE_TAG" \
            -f qualification_run_id="$GITHUB_RUN_ID"

  release-intent-gate:
    name: Release intent gate
    if: ${{ always() && (inputs.release_mode == 'upstream' || inputs.release_mode == 'patch') }}
    needs: [tooling, browser-plan, recover-publication, build, browser, production-serving, package, attest, release]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify release-intent job results
        env:
          RETRY_TAG: ${{ needs.browser-plan.outputs.retry_tag }}
          TOOLING_RESULT: ${{ needs.tooling.result }}
          PLAN_RESULT: ${{ needs.browser-plan.result }}
          RECOVERY_RESULT: ${{ needs.recover-publication.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          SERVING_RESULT: ${{ needs.production-serving.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          ATTEST_RESULT: ${{ needs.attest.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
        shell: bash
        run: |
          set -euo pipefail
          require_result() {
            local name="$1"
            local actual="$2"
            local expected="$3"
            if [[ "$actual" != "$expected" ]]; then
              echo "release intent gate: $name=$actual (expected $expected)" >&2
              exit 1
            fi
          }

          require_result tooling "$TOOLING_RESULT" success
          require_result browser-plan "$PLAN_RESULT" success

          if [[ -n "$RETRY_TAG" ]]; then
            # An immutable tag already exists: only artifact-only recovery may run.
            require_result recover-publication "$RECOVERY_RESULT" success
            require_result build "$BUILD_RESULT" skipped
            require_result browser "$BROWSER_RESULT" skipped
            require_result production-serving "$SERVING_RESULT" skipped
            require_result package "$PACKAGE_RESULT" skipped
            require_result attest "$ATTEST_RESULT" skipped
            require_result release "$RELEASE_RESULT" skipped
          else
            require_result recover-publication "$RECOVERY_RESULT" skipped
            require_result build "$BUILD_RESULT" success
            require_result browser "$BROWSER_RESULT" success
            require_result production-serving "$SERVING_RESULT" success
            require_result package "$PACKAGE_RESULT" success
            require_result attest "$ATTEST_RESULT" success
            require_result release "$RELEASE_RESULT" success
          fi
