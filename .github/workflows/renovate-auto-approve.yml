name: Renovate auto-approval

on:
  workflow_run:
    workflows: ['Full build qualification']
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  approve:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Auto-approval executes the checker from master, never from the PR checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - name: Approve trusted Renovate update
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          prs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/pulls")"
          count="$(
            jq --arg sha "$SOURCE_SHA" '
              [.[] | select(.state == "open" and .user.login == "renovate[bot]" and .head.sha == $sha)] | length
            ' <<<"$prs"
          )"
          if [[ "$count" != 1 ]]; then
            echo "No unique open Renovate PR for $SOURCE_SHA; nothing to approve."
            exit 0
          fi
          pr_number="$(
            jq -r --arg sha "$SOURCE_SHA" '
              .[] | select(.state == "open" and .user.login == "renovate[bot]" and .head.sha == $sha) | .number
            ' <<<"$prs"
          )"
          head_repo="$(jq -r --argjson number "$pr_number" '.[] | select(.number == $number) | .head.repo.full_name' <<<"$prs")"
          [[ "$head_repo" == "$GITHUB_REPOSITORY" ]] || {
            echo "Unexpected Renovate head repository: $head_repo" >&2
            exit 1
          }

          if ! changed_paths="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$pr_number/files" \
              --jq '.[].filename'
          )"; then
            echo "Failed to fetch Renovate PR file list; refusing approval." >&2
            exit 1
          fi
          if [[ -z "$changed_paths" ]]; then
            echo "Empty Renovate PR file list; refusing approval." >&2
            exit 1
          fi

          while IFS= read -r path; do
            case "$path" in
              upstream.lock.json) ;;
              builder-image.json) ;;
              *)
                echo "Refusing unexpected Renovate path: $path" >&2
                exit 1
                ;;
            esac
          done <<< "$changed_paths"

          base_sha="$(
            jq -r --argjson number "$pr_number" \
              '.[] | select(.number == $number and .base.ref == "master") | .base.sha' <<<"$prs"
          )"
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Expected an exact master base SHA" >&2
            exit 1
          }

          snapshot_files="$(mktemp -d)"
          trap 'rm -rf "$snapshot_files"' EXIT
          mapfile -t filenames <<< "$changed_paths"
          for path in "${filenames[@]}"; do
            mkdir -p "$snapshot_files/base/$(dirname "$path")" "$snapshot_files/head/$(dirname "$path")"
            gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$base_sha" --jq .content |
              base64 --decode > "$snapshot_files/base/$path"
            gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$SOURCE_SHA" --jq .content |
              base64 --decode > "$snapshot_files/head/$path"
          done
          upstream_commit="$(jq -er '.commit | select(type == "string" and test("^[0-9a-f]{40}$"))' "$snapshot_files/head/upstream.lock.json")"
          committed_at="$(gh api "repos/microsoft/vscode/git/commits/$upstream_commit" --jq .committer.date)"
          upstream_epoch="$(date -u -d "$committed_at" +%s)"
          [[ "$upstream_epoch" =~ ^[1-9][0-9]*$ ]] || {
            echo "Invalid upstream commit timestamp" >&2
            exit 1
          }
          python3 scripts/verify_renovate_update.py \
            "$snapshot_files/base" "$snapshot_files/head" "$upstream_epoch" "${filenames[@]}"

          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" --jq .head.sha)"
          [[ "$current_sha" == "$SOURCE_SHA" ]] || {
            echo "Renovate PR head moved during validation" >&2
            exit 1
          }

          approved="$(
            gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number/reviews" \
              --jq '[.[] | select(.user.login == "github-actions[bot]" and .state == "APPROVED")] | length'
          )"
          if [[ "$approved" == 0 ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/pulls/$pr_number/reviews" -f event=APPROVE >/dev/null
          fi
