name: Reproducibility verification

on:
  push:
    branches: [fix/release-reproducibility]

permissions: read-all

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        copy: [a, b]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Code-OSS web build prerequisites
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          pkg-config libx11-dev libxkbfile-dev libkrb5-dev
      - name: Independent clean build
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: ./build.sh --clean-upstream
      - name: Archive distribution with metadata
        run: |
          mkdir -p .work
          tar -C dist -cf ".work/dist-${{ matrix.copy }}.tar" .
      - name: Upload distribution archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repro-${{ matrix.copy }}
          path: .work/dist-${{ matrix.copy }}.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

  compare:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Download build A
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: repro-a
          path: .work/repro-a
      - name: Download build B
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: repro-b
          path: .work/repro-b
      - name: Extract distributions
        run: |
          mkdir -p dist-a dist-b
          tar -C dist-a -xf .work/repro-a/dist-a.tar
          tar -C dist-b -xf .work/repro-b/dist-b.tar
      - name: Compare complete distributions
        run: python3 scripts/compare_dist.py dist-a dist-b
