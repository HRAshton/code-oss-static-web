name: Backfill release signature

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to sign; empty uses the latest release
        required: false
        type: string
  push:
    branches: [master]
    paths:
      - '.github/workflows/backfill-release-signature.yml'

concurrency:
  group: backfill-release-signature
  cancel-in-progress: false

permissions: read-all

jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Resolve release and verify published asset digests
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          tag="$REQUESTED_TAG"
          if [[ -z "$tag" ]]; then
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')"
          fi

          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          if [[ "$(jq -r '.draft' <<<"$release")" != 'false' ]]; then
            echo "release $tag is still a draft" >&2
            exit 1
          fi

          if jq -e '.assets[] | select(.name == "release-signature.sigstore.json" or .name == "release-provenance.sigstore.json")' <<<"$release" >/dev/null; then
            echo "release $tag already contains a Scorecard-recognized Sigstore asset"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "already_signed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p artifacts .work
          gh release download "$tag"             --repo "$GITHUB_REPOSITORY"             --pattern SHA256SUMS             --dir artifacts

          while read -r digest asset; do
            asset="${asset#\*}"
            [[ -n "$digest" && -n "$asset" ]] || continue
            api_digest="$(jq -r --arg asset "$asset" '.assets[] | select(.name == $asset) | .digest // empty' <<<"$release")"
            if [[ "$api_digest" != "sha256:$digest" ]]; then
              echo "digest mismatch for release asset $asset: checksums=sha256:$digest api=${api_digest:-missing}" >&2
              exit 1
            fi
          done < artifacts/SHA256SUMS

          release_id="$(jq -r '.id' <<<"$release")"
          jq -n             --arg repository "$GITHUB_REPOSITORY"             --arg tag "$tag"             --arg releaseId "$release_id"             '{
              repository: $repository,
              releaseTag: $tag,
              releaseId: $releaseId,
              backfill: true,
              purpose: "Cryptographically bind the already-published release asset digests without claiming a new build."
            }' > .work/release-signature-predicate.json

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "already_signed=false" >> "$GITHUB_OUTPUT"

      - name: Create keyless Sigstore attestation for existing release
        if: steps.release.outputs.already_signed != 'true'
        id: signature
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: artifacts/SHA256SUMS
          predicate-type: https://github.com/HRAshton/code-oss-static-web/attestations/release-signature/v1
          predicate-path: .work/release-signature-predicate.json

      - name: Attach signature bundle to existing release
        if: steps.release.outputs.already_signed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNATURE_BUNDLE: ${{ steps.signature.outputs.bundle-path }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SIGNATURE_BUNDLE"
          cp "$SIGNATURE_BUNDLE" artifacts/release-signature.sigstore.json
          gh release upload "$RELEASE_TAG"             artifacts/release-signature.sigstore.json             --repo "$GITHUB_REPOSITORY"             --clobber

      - name: Refresh OpenSSF Scorecard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')"
          gh workflow run scorecard.yml --repo "$GITHUB_REPOSITORY" --ref "$default_branch"
