name: Backfill release signature

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to backfill; empty uses the latest release
        required: false
        type: string
  push:
    branches: [master]
    paths:
      - '.github/workflows/backfill-release-signature.yml'

concurrency:
  group: backfill-release-signature
  cancel-in-progress: false

permissions: read-all

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Export and verify existing release provenance
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          tag="$REQUESTED_TAG"
          if [[ -z "$tag" ]]; then
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')"
          fi

          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          if [[ "$(jq -r '.draft' <<<"$release")" != 'false' ]]; then
            echo "release $tag is still a draft" >&2
            exit 1
          fi

          if jq -e '.assets[] | select(.name == "release-signature.sigstore.json" or .name == "release-provenance.sigstore.json")' <<<"$release" >/dev/null; then
            echo "release $tag already contains a Scorecard-recognized Sigstore asset"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "already_signed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          artifact_name="$(
            jq -r '[.assets[].name | select(endswith(".tar.gz"))][0] // empty' <<<"$release"
          )"
          if [[ -z "$artifact_name" ]]; then
            echo "release $tag has no tar.gz artifact to verify" >&2
            exit 1
          fi

          expected_digest="$(
            jq -r --arg asset "$artifact_name" '.assets[] | select(.name == $asset) | .digest // empty' <<<"$release"
          )"
          if [[ ! "$expected_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "release asset $artifact_name has no usable GitHub SHA-256 digest" >&2
            exit 1
          fi

          mkdir -p artifacts .work/release .work/attestations
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$artifact_name" --dir .work/release

          actual_digest="sha256:$(sha256sum ".work/release/$artifact_name" | awk '{print $1}')"
          if [[ "$actual_digest" != "$expected_digest" ]]; then
            echo "downloaded release asset digest mismatch: expected $expected_digest, got $actual_digest" >&2
            exit 1
          fi

          gh attestation verify ".work/release/$artifact_name"             --repo "$GITHUB_REPOSITORY"             --predicate-type https://slsa.dev/provenance/v1

          (
            cd .work/attestations
            gh attestation download "../release/$artifact_name"               --repo "$GITHUB_REPOSITORY"               --predicate-type https://slsa.dev/provenance/v1               --limit 1
          )

          mapfile -t bundles < <(find .work/attestations -maxdepth 1 -type f -name '*.jsonl' -print)
          if [[ "${#bundles[@]}" != 1 ]]; then
            echo "expected exactly one provenance bundle, found ${#bundles[@]}" >&2
            exit 1
          fi

          jq -c . "${bundles[0]}" > artifacts/release-provenance.sigstore.json
          jq -e . artifacts/release-provenance.sigstore.json >/dev/null

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "already_signed=false" >> "$GITHUB_OUTPUT"

      - name: Attach original provenance bundle to existing release
        if: steps.release.outputs.already_signed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG"             artifacts/release-provenance.sigstore.json             --repo "$GITHUB_REPOSITORY"             --clobber

      - name: Refresh OpenSSF Scorecard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')"
          gh workflow run scorecard.yml --repo "$GITHUB_REPOSITORY" --ref "$default_branch"
