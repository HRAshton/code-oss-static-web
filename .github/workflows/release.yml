name: Release

on:
  workflow_dispatch:
    inputs:
      qualification_run_id:
        description: Successful Full build qualification workflow run
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  authorize:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      qualified-tree-sha256: ${{ steps.binding.outputs.tree-sha256 }}
      qualified-file-count: ${{ steps.binding.outputs.file-count }}
      apt_snapshot: ${{ steps.binding.outputs.apt_snapshot }}
    steps:
      - name: Verify release qualification evidence
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
        shell: bash
        run: |
          set -euo pipefail

          qualification=''
          for _ in $(seq 1 60); do
            qualification="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN_ID")"
            if [[ "$(jq -r '.status' <<<"$qualification")" == 'completed' ]]; then
              break
            fi
            sleep 2
          done

          [[ "$(jq -r '.status' <<<"$qualification")" == 'completed' ]]
          [[ "$(jq -r '.conclusion' <<<"$qualification")" == 'success' ]]
          [[ "$(jq -r '.event' <<<"$qualification")" == 'workflow_dispatch' ]]
          qualification_name="$(jq -r '.name' <<<"$qualification")"
          qualification_path="$(jq -r '.path' <<<"$qualification")"
          case "$qualification_name:$qualification_path" in
            'Full build qualification:.github/workflows/qualify.yml'|\
            'Upstream soak break-glass:.github/workflows/upstream-soak-break-glass.yml')
              ;;
            *)
              echo "unrecognized qualification workflow: $qualification_name ($qualification_path)" >&2
              exit 1
              ;;
          esac
          [[ "$(jq -r '.head_branch' <<<"$qualification")" == 'master' ]]
          [[ "$(jq -r '.head_sha' <<<"$qualification")" == "$GITHUB_SHA" ]]

          evidence_count="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN_ID/artifacts"               --jq '[.artifacts[] | select(.name == "release-qualification" and .expired == false)] | length'
          )"
          if [[ "$evidence_count" != 1 ]]; then
            echo "qualification evidence artifact missing for run $QUALIFICATION_RUN_ID" >&2
            exit 1
          fi

      - name: Download release qualification evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-qualification
          path: .work/release-qualification
          run-id: ${{ inputs.qualification_run_id }}
          github-token: ${{ github.token }}

      - name: Verify qualification provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify \
            .work/release-qualification/artifact-manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --bundle .work/release-qualification/qualification-provenance.sigstore.json \
            --source-ref refs/heads/master >/dev/null

      - name: Verify release qualification binding
        id: binding
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(
            gh api "repos/$GITHUB_REPOSITORY/contents/.github/toolchain-versions.json?ref=$GITHUB_SHA" \
              --jq '.content' | base64 --decode | jq -c '{node, python}'
          )"
          builder_lock=.work/release-qualification/builder-image.json
          gh api "repos/$GITHUB_REPOSITORY/contents/builder-image.json?ref=$GITHUB_SHA" \
            --jq '.content' | base64 --decode > "$builder_lock"
          snapshot_lock=.work/release-qualification/builder-apt-snapshot.json
          gh api "repos/$GITHUB_REPOSITORY/contents/builder-apt-snapshot.json?ref=$GITHUB_SHA" \
            --jq '.content' | base64 --decode > "$snapshot_lock"
          builder="$(jq -cs '.[0] as $image | .[1] as $apt | {image: $image.image, digest: $image.digest, platform: $image.platform, aptSnapshot: $apt.aptSnapshot}' "$builder_lock" "$snapshot_lock")"
          builder_input_sha256="$(sha256sum "$builder_lock" | awk '{print $1}')"
          snapshot_input_sha256="$(sha256sum "$snapshot_lock" | awk '{print $1}')"
          evidence=.work/release-qualification/release-qualification.json
          manifest=.work/release-qualification/artifact-manifest.json
          admission=.work/release-qualification/vulnerability-admission.json

          jq -e '.schemaVersion == 1 and .passed == true' "$admission" >/dev/null

          jq -e \
            --arg commit "$GITHUB_SHA" \
            --arg tag "$GITHUB_REF_NAME" \
            --argjson workflowRunId "$QUALIFICATION_RUN_ID" \
            --argjson toolchain "$toolchain" \
            --argjson builder "$builder" \
            '
              .commit == $commit and
              .expectedSourceSha == $commit and
              .tag == $tag and
              .workflowRunId == $workflowRunId and
              .toolchain == $toolchain and
              .builder == $builder and
              (.releaseMode == "upstream" or .releaseMode == "patch")
            ' \
            "$evidence" >/dev/null

          qualified_tree_sha256="$(jq -r '.distribution.treeSha256' "$evidence")"
          qualified_file_count="$(jq -r '.distribution.fileCount' "$evidence")"
          if [[ ! "$qualified_tree_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "invalid qualified distribution tree digest: $qualified_tree_sha256" >&2
            exit 1
          fi
          if [[ ! "$qualified_file_count" =~ ^[1-9][0-9]*$ ]]; then
            echo "invalid qualified distribution file count: $qualified_file_count" >&2
            exit 1
          fi

          jq -e \
            --arg commit "$GITHUB_SHA" \
            --argjson toolchain "$toolchain" \
            --argjson builder "$builder" \
            --arg builderInputSha256 "$builder_input_sha256" \
            --arg snapshotInputSha256 "$snapshot_input_sha256" \
            --arg treeSha256 "$qualified_tree_sha256" \
            --argjson fileCount "$qualified_file_count" \
            '
              .schemaVersion == 1 and
              .project.commit == $commit and
              .toolchain == $toolchain and
              .builder == $builder and
              .inputs.builderImage.path == "builder-image.json" and
              .inputs.builderImage.sha256 == $builderInputSha256 and
              .inputs.builderAptSnapshot.path == "builder-apt-snapshot.json" and
              .inputs.builderAptSnapshot.sha256 == $snapshotInputSha256 and
              .distribution.treeSha256 == $treeSha256 and
              .distribution.fileCount == $fileCount
            ' \
            "$manifest" >/dev/null

          apt_snapshot="$(jq -er '.aptSnapshot' "$snapshot_lock")"
          [[ "$apt_snapshot" =~ ^[0-9]{8}T[0-9]{6}Z$ ]]
          {
            echo "apt_snapshot=$apt_snapshot"
            echo "tree-sha256=$qualified_tree_sha256"
            echo "file-count=$qualified_file_count"
          } >> "$GITHUB_OUTPUT"
          echo "Qualified distribution identity: $qualified_tree_sha256 ($qualified_file_count files)"

      - name: Verify release commit is on protected default branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')"
          compare_status="$(
            gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$default_branch" --jq '.status'
          )"
          if [[ "$compare_status" != 'ahead' && "$compare_status" != 'identical' ]]; then
            echo "release commit $GITHUB_SHA is not contained in protected default branch $default_branch" >&2
            exit 1
          fi

  build:
    needs: authorize
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/ubuntu@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517
      volumes:
        - /etc/ssl/certs/ca-certificates.crt:/tmp/runner-ca-bundle.pem:ro
    permissions:
      contents: read
    env:
      APT_SNAPSHOT: ${{ needs.authorize.outputs.apt_snapshot }}
    steps:
      - name: Bootstrap snapshot-locked builder packages
        shell: bash
        run: |
          set -euo pipefail
          # Minimal Ubuntu has no CA roots; trust the runner bundle for snapshot TLS only.
          test -s /tmp/runner-ca-bundle.pem
          apt-get update --snapshot "$APT_SNAPSHOT" \
            -o Acquire::https::CaInfo=/tmp/runner-ca-bundle.pem \
            -o APT::Update::Error-Mode=any
          snapshot_origin="https://snapshot.ubuntu.com/ubuntu/$APT_SNAPSHOT"
          apt-cache -o APT::Snapshot="$APT_SNAPSHOT" policy build-essential |
            grep -F "$snapshot_origin"
          DEBIAN_FRONTEND=noninteractive apt-get install \
            --snapshot "$APT_SNAPSHOT" -y --no-install-recommends \
            -o Acquire::https::CaInfo=/tmp/runner-ca-bundle.pem \
            ca-certificates curl git jq tar unzip xz-utils \
            build-essential pkg-config libx11-dev libxkbfile-dev libkrb5-dev

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify builder APT snapshot lock
        run: test "$(jq -er '.aptSnapshot' builder-apt-snapshot.json)" = "$APT_SNAPSHOT"

      - name: Set up canonical toolchain
        id: toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Verify release tag contract
        run: python3 scripts/check_release_tag.py "$GITHUB_REF_NAME"

      - name: Clean release build
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: ./build.sh --clean-upstream

      - name: Structural artifact smoke test
        run: python3 scripts/smoke_static.py dist

      - name: Verify qualified distribution identity
        env:
          QUALIFIED_TREE_SHA256: ${{ needs.authorize.outputs.qualified-tree-sha256 }}
          QUALIFIED_FILE_COUNT: ${{ needs.authorize.outputs.qualified-file-count }}
        shell: bash
        run: >-
          python3 scripts/verify_dist_identity.py
          --expected-sha256 "$QUALIFIED_TREE_SHA256"
          --expected-file-count "$QUALIFIED_FILE_COUNT"
          dist

      - name: Capture runtime component metadata
        run: >-
          python3 scripts/generate_runtime_metadata.py
          --dist dist
          --lock .work/vscode/package-lock.json
          --output .work/runtime-components.json

      - name: Archive canonical static distribution
        run: |
          mkdir -p .work
          tar -C dist -cf .work/release-static-dist.tar .

      - name: Upload canonical static distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-static-dist
          path: .work/release-static-dist.tar
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Upload locked Playwright runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-playwright-runtime
          path: .work/playwright-runtime/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Upload build metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-metadata
          path: .work/runtime-components.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

  rebuild:
    needs: authorize
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/ubuntu@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517
      volumes:
        - /etc/ssl/certs/ca-certificates.crt:/tmp/runner-ca-bundle.pem:ro
    permissions:
      contents: read
    env:
      APT_SNAPSHOT: ${{ needs.authorize.outputs.apt_snapshot }}
    steps:
      - name: Bootstrap snapshot-locked builder packages
        shell: bash
        run: |
          set -euo pipefail
          # Minimal Ubuntu has no CA roots; trust the runner bundle for snapshot TLS only.
          test -s /tmp/runner-ca-bundle.pem
          apt-get update --snapshot "$APT_SNAPSHOT" \
            -o Acquire::https::CaInfo=/tmp/runner-ca-bundle.pem \
            -o APT::Update::Error-Mode=any
          snapshot_origin="https://snapshot.ubuntu.com/ubuntu/$APT_SNAPSHOT"
          apt-cache -o APT::Snapshot="$APT_SNAPSHOT" policy build-essential |
            grep -F "$snapshot_origin"
          DEBIAN_FRONTEND=noninteractive apt-get install \
            --snapshot "$APT_SNAPSHOT" -y --no-install-recommends \
            -o Acquire::https::CaInfo=/tmp/runner-ca-bundle.pem \
            ca-certificates curl git jq tar unzip xz-utils \
            build-essential pkg-config libx11-dev libxkbfile-dev libkrb5-dev

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify builder APT snapshot lock
        run: test "$(jq -er '.aptSnapshot' builder-apt-snapshot.json)" = "$APT_SNAPSHOT"

      - name: Set up canonical toolchain
        id: toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Independent clean rebuild
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: ./build.sh --clean-upstream

      - name: Archive independent static distribution
        run: |
          mkdir -p .work
          tar -C dist -cf .work/release-rebuild-static-dist.tar .

      - name: Upload independent static distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-rebuild-static-dist
          path: .work/release-rebuild-static-dist.tar
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

  reproducibility:
    needs: [build, rebuild]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up canonical Python
        uses: ./.github/actions/setup-toolchain
        with:
          node: 'false'

      - name: Download reference distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-static-dist
          path: .work/release-static-dist

      - name: Download independent distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-rebuild-static-dist
          path: .work/release-rebuild-static-dist

      - name: Extract reference distribution
        run: |
          rm -rf reference-dist
          mkdir -p reference-dist
          tar -C reference-dist -xf .work/release-static-dist/release-static-dist.tar

      - name: Extract independent distribution
        run: |
          rm -rf rebuild-dist
          mkdir -p rebuild-dist
          tar -C rebuild-dist -xf .work/release-rebuild-static-dist/release-rebuild-static-dist.tar

      - name: Compare normalized distributions
        run: python3 scripts/compare_dist.py reference-dist rebuild-dist

  browser:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Qualify release browser
        uses: ./.github/actions/browser-qualification
        with:
          browser: ${{ matrix.browser }}
          distribution-artifact: release-static-dist
          playwright-runtime-artifact: release-playwright-runtime
          scope: full
          diagnostics-artifact: release-qualification-diagnostics-${{ matrix.browser }}

  package:
    needs: [browser, reproducibility]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up canonical Python
        id: toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          node: 'false'

      - name: Download qualified static distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-static-dist
          path: .work/release-static-dist

      - name: Extract canonical static distribution
        run: |
          rm -rf dist
          mkdir -p dist
          tar -C dist -xf .work/release-static-dist/release-static-dist.tar

      - name: Download build metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-build-metadata
          path: .work

      - name: Download locked Playwright runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-playwright-runtime
          path: .work/playwright-runtime

      - name: Generate independent final-distribution SBOM
        uses: ./.github/actions/independent-sbom
        with:
          path: dist
          output-file: .work/independent-sbom.cdx.json

      - name: Package and verify canonical release
        env:
          CODE_OSS_STATIC_WEB_RELEASE_TAG: ${{ github.ref_name }}
          CODE_OSS_STATIC_WEB_PLAYWRIGHT_RUNTIME: .work/playwright-runtime
        run: ./package.sh

      - name: Upload verified candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  attest:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download verified candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-candidate
          path: artifacts

      - name: Attest release provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: artifacts/SHA256SUMS

      - name: Attest release SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/code-oss-static-web-*.tar.gz
            artifacts/code-oss-static-web-*.zip
          sbom-path: artifacts/sbom.cdx.json

      - name: Upload release provenance bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-attestation
          path: ${{ steps.provenance.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 30

  github-release:
    needs: attest
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up canonical Python
        uses: ./.github/actions/setup-toolchain
        with:
          node: 'false'

      - name: Download verified candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-candidate
          path: artifacts

      - name: Download release provenance bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-attestation
          path: .work/release-attestation

      - name: Verify immutable release ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected_pattern='refs/tags/v*-web.*'

          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq '.sha')"
          if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "release tag target mismatch: expected $GITHUB_SHA, got $tag_sha" >&2
            exit 1
          fi

          protected=0
          while IFS= read -r ruleset_id; do
            [[ -n "$ruleset_id" ]] || continue
            ruleset="$(gh api "repos/$GITHUB_REPOSITORY/rulesets/$ruleset_id")"
            if jq -e --arg pattern "$expected_pattern" '
              (.target == "tag") and
              (.enforcement == "active") and
              (((.conditions.ref_name.include // []) | index($pattern)) != null) and
              ((([.rules[].type] | index("update")) != null)) and
              ((([.rules[].type] | index("deletion")) != null)) and
              (((.bypass_actors // []) | length) == 0)
            ' <<<"$ruleset" >/dev/null; then
              protected=1
              break
            fi
          done < <(
            gh api "repos/$GITHUB_REPOSITORY/rulesets" \
              --jq '.[] | select(.target == "tag" and .enforcement == "active") | .id'
          )

          if [[ "$protected" != 1 ]]; then
            echo "no active immutable release-tag ruleset protects $expected_pattern" >&2
            exit 1
          fi

          tag_sha_after="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq '.sha')"
          if [[ "$tag_sha_after" != "$GITHUB_SHA" ]]; then
            echo "release tag moved during integrity check: expected $GITHUB_SHA, got $tag_sha_after" >&2
            exit 1
          fi

      - name: Publish or verify GitHub Release
        uses: ./.github/actions/publish-github-release
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          tag: ${{ github.ref_name }}

  scorecard-refresh:
    needs: immutable-publication-status
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Refresh OpenSSF Scorecard after publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')"
          gh workflow run scorecard.yml --repo "$GITHUB_REPOSITORY" --ref "$default_branch"

  oci:
    needs: attest
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify immutable release ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected_pattern='refs/tags/v*-web.*'

          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq '.sha')"
          if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "release tag target mismatch: expected $GITHUB_SHA, got $tag_sha" >&2
            exit 1
          fi

          protected=0
          while IFS= read -r ruleset_id; do
            [[ -n "$ruleset_id" ]] || continue
            ruleset="$(gh api "repos/$GITHUB_REPOSITORY/rulesets/$ruleset_id")"
            if jq -e --arg pattern "$expected_pattern" '
              (.target == "tag") and
              (.enforcement == "active") and
              (((.conditions.ref_name.include // []) | index($pattern)) != null) and
              ((([.rules[].type] | index("update")) != null)) and
              ((([.rules[].type] | index("deletion")) != null)) and
              (((.bypass_actors // []) | length) == 0)
            ' <<<"$ruleset" >/dev/null; then
              protected=1
              break
            fi
          done < <(
            gh api "repos/$GITHUB_REPOSITORY/rulesets"               --jq '.[] | select(.target == "tag" and .enforcement == "active") | .id'
          )

          if [[ "$protected" != 1 ]]; then
            echo "no active immutable release-tag ruleset protects $expected_pattern" >&2
            exit 1
          fi

          tag_sha_after="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq '.sha')"
          if [[ "$tag_sha_after" != "$GITHUB_SHA" ]]; then
            echo "release tag moved during integrity check: expected $GITHUB_SHA, got $tag_sha_after" >&2
            exit 1
          fi

      - name: Download qualified static distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-static-dist
          path: .work/release-static-dist

      - name: Extract canonical static distribution
        run: |
          rm -rf dist
          mkdir -p dist
          tar -C dist -xf .work/release-static-dist/release-static-dist.tar

      - name: Publish or verify GHCR
        uses: ./.github/actions/publish-oci
        with:
          github-token: ${{ github.token }}
          image: ghcr.io/hrashton/code-oss-static-web:${{ github.ref_name }}
          commit: ${{ github.sha }}
          tag: ${{ github.ref_name }}
          dist-path: dist

  immutable-publication-status:
    if: always()
    needs: [github-release, oci]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify publication channels
        env:
          GITHUB_RELEASE_RESULT: ${{ needs.github-release.result }}
          OCI_RESULT: ${{ needs.oci.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RELEASE_RESULT" == success ]]
          [[ "$OCI_RESULT" == success ]]
          echo "Immutable release publication complete for $GITHUB_REF_NAME"

  promote:
    needs: immutable-publication-status
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Start automatic canary and stable promotion
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run promote.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f release_tag="$GITHUB_REF_NAME" \
            -f source_release_run_id="$GITHUB_RUN_ID" \
            -f target=auto
