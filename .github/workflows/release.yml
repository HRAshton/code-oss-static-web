name: Release

on:
  workflow_dispatch:
    inputs:
      qualification_run_id:
        description: Successful Full build qualification workflow run
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  authorize:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: read
    steps:
      - name: Verify release qualification evidence
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
        shell: bash
        run: |
          set -euo pipefail

          qualification=''
          for _ in $(seq 1 60); do
            qualification="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN_ID")"
            if [[ "$(jq -r '.status' <<<"$qualification")" == 'completed' ]]; then
              break
            fi
            sleep 2
          done

          [[ "$(jq -r '.status' <<<"$qualification")" == 'completed' ]]
          [[ "$(jq -r '.conclusion' <<<"$qualification")" == 'success' ]]
          [[ "$(jq -r '.event' <<<"$qualification")" == 'workflow_dispatch' ]]
          [[ "$(jq -r '.name' <<<"$qualification")" == 'Full build qualification' ]]
          [[ "$(jq -r '.path' <<<"$qualification")" == '.github/workflows/qualify.yml' ]]
          [[ "$(jq -r '.head_branch' <<<"$qualification")" == 'master' ]]
          [[ "$(jq -r '.head_sha' <<<"$qualification")" == "$GITHUB_SHA" ]]

          evidence_count="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN_ID/artifacts"               --jq '[.artifacts[] | select(.name == "release-qualification" and .expired == false)] | length'
          )"
          if [[ "$evidence_count" != 1 ]]; then
            echo "qualification evidence artifact missing for run $QUALIFICATION_RUN_ID" >&2
            exit 1
          fi

      - name: Download release qualification evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-qualification
          path: .work/release-qualification
          run-id: ${{ inputs.qualification_run_id }}
          github-token: ${{ github.token }}

      - name: Verify release qualification binding
        env:
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -e             --arg commit "$GITHUB_SHA"             --arg tag "$GITHUB_REF_NAME"             --argjson workflowRunId "$QUALIFICATION_RUN_ID"             '
              .commit == $commit and
              .tag == $tag and
              .workflowRunId == $workflowRunId and
              (.releaseMode == "upstream" or .releaseMode == "patch")
            '             .work/release-qualification/release-qualification.json >/dev/null

      - name: Verify release commit is on protected default branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')"
          compare_status="$(
            gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$default_branch" --jq '.status'
          )"
          if [[ "$compare_status" != 'ahead' && "$compare_status" != 'identical' ]]; then
            echo "release commit $GITHUB_SHA is not contained in protected default branch $default_branch" >&2
            exit 1
          fi

      - name: Verify GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "GitHub Pages is not enabled. Set Settings > Pages > Build and deployment > Source to GitHub Actions." >&2
            exit 1
          fi

  build:
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Verify release tag contract
        run: python3 scripts/check_release_tag.py "$GITHUB_REF_NAME"

      - name: Install Code-OSS web build prerequisites
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          pkg-config libx11-dev libxkbfile-dev libkrb5-dev

      - name: Clean release build
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: ./build.sh --clean-upstream

      - name: Structural artifact smoke test
        run: python3 scripts/smoke_static.py dist

      - name: Capture runtime component metadata
        run: >-
          python3 scripts/generate_runtime_metadata.py
          --dist dist
          --lock .work/vscode/package-lock.json
          --output .work/runtime-components.json

      - name: Archive canonical static distribution
        run: |
          mkdir -p .work
          tar -C dist -cf .work/release-static-dist.tar .

      - name: Upload canonical static distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-static-dist
          path: .work/release-static-dist.tar
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Upload locked Playwright runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-playwright-runtime
          path: .work/playwright-runtime/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Upload build metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-metadata
          path: .work/runtime-components.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

  reproducibility:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Download reference distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-static-dist
          path: .work/release-static-dist

      - name: Extract reference distribution
        run: |
          rm -rf reference-dist
          mkdir -p reference-dist
          tar -C reference-dist -xf .work/release-static-dist/release-static-dist.tar

      - name: Install Code-OSS web build prerequisites
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          pkg-config libx11-dev libxkbfile-dev libkrb5-dev

      - name: Independent clean rebuild
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: ./build.sh --clean-upstream

      - name: Compare normalized distributions
        run: python3 scripts/compare_dist.py reference-dist dist

  browser:
    needs: [build, reproducibility]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PLAYWRIGHT_BROWSERS_PATH: .work/playwright-browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Download canonical static distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-static-dist
          path: .work/release-static-dist

      - name: Extract canonical static distribution
        run: |
          rm -rf dist
          mkdir -p dist
          tar -C dist -xf .work/release-static-dist/release-static-dist.tar

      - name: Download locked Playwright runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-playwright-runtime
          path: .work/playwright-runtime

      - name: Install locked Chromium
        run: python3 scripts/install_playwright_browser.py --with-deps chromium

      - name: Browser boot gate
        run: >-
          python3 scripts/run_e2e.py
          --project chromium
          --dist dist
          --grep "packaged workbench boots from static hosting"
          --grep-invert @extension
          --retries=0

      - name: Browser qualification
        run: >-
          python3 scripts/run_e2e.py
          --project chromium
          --dist dist
          --grep-invert @extension

      - name: Prepare extension-host qualification copy
        run: |
          rm -rf .work/qualification-dist
          cp -a dist .work/qualification-dist
          python3 scripts/add_test_extension.py --dist .work/qualification-dist

      - name: Browser extension-host qualification
        run: >-
          python3 scripts/run_e2e.py
          --project chromium
          --dist .work/qualification-dist
          --grep @extension

  package:
    needs: browser
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Download qualified static distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-static-dist
          path: .work/release-static-dist

      - name: Extract canonical static distribution
        run: |
          rm -rf dist
          mkdir -p dist
          tar -C dist -xf .work/release-static-dist/release-static-dist.tar

      - name: Download build metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-build-metadata
          path: .work

      - name: Package and verify canonical release
        env:
          CODE_OSS_STATIC_WEB_RELEASE_TAG: ${{ github.ref_name }}
        run: ./package.sh

      - name: Upload verified candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  attest:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download verified candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-candidate
          path: artifacts

      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: artifacts/SHA256SUMS

      - name: Attest release SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/code-oss-static-web-*.tar.gz
            artifacts/code-oss-static-web-*.zip
          sbom-path: artifacts/sbom.cdx.json

  github-release:
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-candidate
          path: artifacts

      - name: Verify immutable release ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected_pattern='refs/tags/v*-web.*'

          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq '.sha')"
          if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "release tag target mismatch: expected $GITHUB_SHA, got $tag_sha" >&2
            exit 1
          fi

          protected=0
          while IFS= read -r ruleset_id; do
            [[ -n "$ruleset_id" ]] || continue
            ruleset="$(gh api "repos/$GITHUB_REPOSITORY/rulesets/$ruleset_id")"
            if jq -e --arg pattern "$expected_pattern" '
              (.target == "tag") and
              (.enforcement == "active") and
              (((.conditions.ref_name.include // []) | index($pattern)) != null) and
              ((([.rules[].type] | index("update")) != null)) and
              ((([.rules[].type] | index("deletion")) != null)) and
              (((.bypass_actors // []) | length) == 0)
            ' <<<"$ruleset" >/dev/null; then
              protected=1
              break
            fi
          done < <(
            gh api "repos/$GITHUB_REPOSITORY/rulesets" \
              --jq '.[] | select(.target == "tag" and .enforcement == "active") | .id'
          )

          if [[ "$protected" != 1 ]]; then
            echo "no active immutable release-tag ruleset protects $expected_pattern" >&2
            exit 1
          fi

          tag_sha_after="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq '.sha')"
          if [[ "$tag_sha_after" != "$GITHUB_SHA" ]]; then
            echo "release tag moved during integrity check: expected $GITHUB_SHA, got $tag_sha_after" >&2
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          artifacts/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"

  pages:
    needs: attest
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Download qualified static distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-static-dist
          path: .work/release-static-dist

      - name: Extract canonical static distribution
        run: |
          rm -rf dist
          mkdir -p dist
          tar -C dist -xf .work/release-static-dist/release-static-dist.tar

      - name: Verify immutable release ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected_pattern='refs/tags/v*-web.*'

          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq '.sha')"
          if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "release tag target mismatch: expected $GITHUB_SHA, got $tag_sha" >&2
            exit 1
          fi

          protected=0
          while IFS= read -r ruleset_id; do
            [[ -n "$ruleset_id" ]] || continue
            ruleset="$(gh api "repos/$GITHUB_REPOSITORY/rulesets/$ruleset_id")"
            if jq -e --arg pattern "$expected_pattern" '
              (.target == "tag") and
              (.enforcement == "active") and
              (((.conditions.ref_name.include // []) | index($pattern)) != null) and
              ((([.rules[].type] | index("update")) != null)) and
              ((([.rules[].type] | index("deletion")) != null)) and
              (((.bypass_actors // []) | length) == 0)
            ' <<<"$ruleset" >/dev/null; then
              protected=1
              break
            fi
          done < <(
            gh api "repos/$GITHUB_REPOSITORY/rulesets"               --jq '.[] | select(.target == "tag" and .enforcement == "active") | .id'
          )

          if [[ "$protected" != 1 ]]; then
            echo "no active immutable release-tag ruleset protects $expected_pattern" >&2
            exit 1
          fi

          tag_sha_after="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq '.sha')"
          if [[ "$tag_sha_after" != "$GITHUB_SHA" ]]; then
            echo "release tag moved during integrity check: expected $GITHUB_SHA, got $tag_sha_after" >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  oci:
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify immutable release ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected_pattern='refs/tags/v*-web.*'

          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq '.sha')"
          if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "release tag target mismatch: expected $GITHUB_SHA, got $tag_sha" >&2
            exit 1
          fi

          protected=0
          while IFS= read -r ruleset_id; do
            [[ -n "$ruleset_id" ]] || continue
            ruleset="$(gh api "repos/$GITHUB_REPOSITORY/rulesets/$ruleset_id")"
            if jq -e --arg pattern "$expected_pattern" '
              (.target == "tag") and
              (.enforcement == "active") and
              (((.conditions.ref_name.include // []) | index($pattern)) != null) and
              ((([.rules[].type] | index("update")) != null)) and
              ((([.rules[].type] | index("deletion")) != null)) and
              (((.bypass_actors // []) | length) == 0)
            ' <<<"$ruleset" >/dev/null; then
              protected=1
              break
            fi
          done < <(
            gh api "repos/$GITHUB_REPOSITORY/rulesets"               --jq '.[] | select(.target == "tag" and .enforcement == "active") | .id'
          )

          if [[ "$protected" != 1 ]]; then
            echo "no active immutable release-tag ruleset protects $expected_pattern" >&2
            exit 1
          fi

          tag_sha_after="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq '.sha')"
          if [[ "$tag_sha_after" != "$GITHUB_SHA" ]]; then
            echo "release tag moved during integrity check: expected $GITHUB_SHA, got $tag_sha_after" >&2
            exit 1
          fi

      - name: Download qualified static distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-static-dist
          path: .work/release-static-dist

      - name: Extract canonical static distribution
        run: |
          rm -rf dist
          mkdir -p dist
          tar -C dist -xf .work/release-static-dist/release-static-dist.tar

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: |
            image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Build and push OCI image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/hrashton/code-oss-static-web:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/HRAshton/code-oss-static-web
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
