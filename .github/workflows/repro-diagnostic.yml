name: Reproducibility diagnostic

on:
  push:
    branches: [fix/release-reproducibility]

permissions: read-all

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Code-OSS web build prerequisites
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          pkg-config libx11-dev libxkbfile-dev libkrb5-dev
      - name: First clean build
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          ./build.sh --clean-upstream
          mv dist reference-dist
      - name: Second clean build
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: ./build.sh --clean-upstream
      - name: Compare distributions
        run: python3 scripts/compare_dist.py reference-dist dist
