name: CI
on: [push, pull_request]
permissions: read-all
jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Commit message policy
        if: github.event_name == 'push'
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: python3 scripts/check_commit_message.py "$COMMIT_MESSAGE"

      - name: JSON schema validation
        run: python3 scripts/validate_json_schema.py

      - name: Configuration validation
        run: python3 scripts/validate_config.py

      - name: Workflow YAML syntax
        run: ruby scripts/check_workflow_yaml.rb

      - name: Repository policy
        run: python3 scripts/check_policy.py

      - name: Ruff lint
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: '0.16.9'
          args: 'check'

      - name: Export normalization workspace
        if: always()
        shell: bash
        run: |
          mkdir -p .work/style-tool
          cp "$(command -v ruff)" .work/style-tool/ruff

      - name: Upload normalization workspace
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: style-normalization
          path: |
            .work/style-tool/ruff
            scripts/
            tests/
            pyproject.toml
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

      - name: Ruff format check
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: '0.16.9'
          args: 'format --check'

      - name: Pyright
        uses: jakebailey/pyright-action@8ec14b5cfe41f26e5f41686a31eb6012758217ef # v3.0.2
        with:
          version: '1.1.414'
          project: pyproject.toml
          annotate: errors

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          version: v0.11.0

      - name: Python syntax
        run: python3 -m compileall -q scripts tests
      - name: JavaScript syntax
        shell: bash
        run: |
          for file in tests/e2e/*.cjs tests/fixtures/web-extension/*.js; do
            node --check "$file"
          done
      - name: Tooling and policy tests
        run: python3 -m unittest discover -s tests -v
